name: trail-gate
description: Agent audit trail: hash-chained, tamper-evident log of agent decisions and tool calls that verifies its own chain.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
